[build]
  command = "npm run build"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/academy/catalog"
  to = "/.netlify/functions/academy-catalog"
  status = 200

[[redirects]]
  from = "/api/academy/profile"
  to = "/.netlify/functions/academy-profile"
  status = 200

[[redirects]]
  from = "/api/academy/enrollments"
  to = "/.netlify/functions/academy-enroll"
  status = 200

[[redirects]]
  from = "/api/academy/preview"
  to = "/.netlify/functions/academy-preview"
  status = 200

[[redirects]]
  from = "/api/academy/checkout"
  to = "/.netlify/functions/academy-checkout"
  status = 200

[[redirects]]
  from = "/api/academy/paid-content"
  to = "/.netlify/functions/academy-content"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
